<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Sandboxed agent: launcher, container with OpenCode, proxy allowlist</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#E8A33D"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#15202E"/>
  <g transform="translate(0 40)">

  <text x="60" y="150" fill="#E8A33D" font-size="34" font-weight="700" letter-spacing="5">SANDBOXED AGENT</text>

  <!-- Launcher -->
  <g>
    <rect x="60" y="330" width="250" height="240" rx="22" fill="#1D2B3D" stroke="#2E4058" stroke-width="3"/>
    <path d="M160 382L182 402L160 422" fill="none" stroke="#EEF3F9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <rect x="192" y="414" width="30" height="7" rx="3" fill="#EEF3F9" opacity="0.85"/>
    <text x="185" y="494" fill="#EEF3F9" font-size="42" font-weight="600" text-anchor="middle">Launcher</text>
    <text x="185" y="536" fill="#9AAABD" font-size="28" text-anchor="middle">One command</text>
  </g>
  <path d="M318 450H378" stroke="#E8A33D" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <!-- Container: agent and proxy -->
  <g>
    <rect x="390" y="210" width="720" height="480" rx="28" fill="#22344B" stroke="#E8A33D" stroke-width="4"/>
    <text x="430" y="262" fill="#9AAABD" font-size="26" font-weight="600" letter-spacing="3">DOCKER</text>

    <rect x="430" y="310" width="330" height="280" rx="20" fill="#0F1824" stroke="#2E4058" stroke-width="3"/>
    <rect x="540" y="346" width="110" height="96" rx="12" fill="#15202E" stroke="#E8A33D" stroke-width="3"/>
    <path d="M560 372L580 390L560 408" fill="none" stroke="#E8A33D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="590" y="404" width="36" height="7" rx="3" fill="#E8A33D"/>
    <text x="595" y="508" fill="#EEF3F9" font-size="42" font-weight="600" text-anchor="middle">OpenCode</text>
    <text x="595" y="550" fill="#9AAABD" font-size="28" text-anchor="middle">Coding agent</text>

    <path d="M768 450H828" stroke="#E8A33D" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

    <rect x="840" y="310" width="230" height="280" rx="20" fill="#0F1824" stroke="#2E4058" stroke-width="3"/>
    <g fill="#EEF3F9" opacity="0.85">
      <rect x="905" y="350" width="12" height="96" rx="4"/>
      <rect x="949" y="350" width="12" height="96" rx="4"/>
      <rect x="993" y="350" width="12" height="96" rx="4"/>
      <rect x="893" y="372" width="124" height="10" rx="4"/>
      <rect x="893" y="414" width="124" height="10" rx="4"/>
    </g>
    <text x="955" y="508" fill="#EEF3F9" font-size="42" font-weight="600" text-anchor="middle">Proxy</text>
    <text x="955" y="550" fill="#9AAABD" font-size="28" text-anchor="middle">Allowlist</text>
  </g>

  <!-- Destinations -->
  <g stroke-width="4" fill="none">
    <path d="M1078 450C1130 450 1130 285 1186 285" stroke="#E8A33D" marker-end="url(#arrow)"/>
    <path d="M1078 450C1130 450 1130 395 1186 395" stroke="#E8A33D" marker-end="url(#arrow)"/>
    <path d="M1078 450C1130 450 1130 505 1176 505" stroke="#4E5F74" stroke-dasharray="10 9"/>
    <path d="M1078 450C1130 450 1130 615 1176 615" stroke="#4E5F74" stroke-dasharray="10 9"/>
  </g>

  <g font-size="32">
    <rect x="1196" y="245" width="344" height="80" rx="16" fill="#1D2B3D" stroke="#E8A33D" stroke-width="3"/>
    <path d="M1222 286L1236 300L1260 272" fill="none" stroke="#E8A33D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1280" y="296" fill="#EEF3F9" font-weight="600">Internal LLM</text>

    <rect x="1196" y="355" width="344" height="80" rx="16" fill="#1D2B3D" stroke="#E8A33D" stroke-width="3"/>
    <path d="M1222 396L1236 410L1260 382" fill="none" stroke="#E8A33D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1280" y="406" fill="#EEF3F9" font-weight="600">Allowed services</text>

    <rect x="1196" y="465" width="344" height="80" rx="16" fill="none" stroke="#2E4058" stroke-width="3" stroke-dasharray="10 8"/>
    <path d="M1226 490L1254 518M1254 490L1226 518" stroke="#7D8CA1" stroke-width="6" stroke-linecap="round"/>
    <text x="1280" y="516" fill="#9AAABD">Git &amp; wiki writes</text>

    <rect x="1196" y="575" width="344" height="80" rx="16" fill="none" stroke="#2E4058" stroke-width="3" stroke-dasharray="10 8"/>
    <path d="M1226 600L1254 628M1254 600L1226 628" stroke="#7D8CA1" stroke-width="6" stroke-linecap="round"/>
    <text x="1280" y="626" fill="#9AAABD">Everything else</text>
  </g>
  </g>
</svg>
